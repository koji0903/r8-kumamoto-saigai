name: サイト整合性チェック

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML・データ・JavaScriptを検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5
        with:
          # sitemap.xml の lastmod は各HTMLの最終コミット日から生成する。
          # shallow cloneではHTML以外だけを更新したcommitで履歴を取得できない。
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: SEO生成物を検査
        run: |
          node tools/build-seo.mjs --check

      - name: 災害データを検査
        if: ${{ always() }}
        run: |
          node tools/check-data.mjs

      - name: 暮らしの再建ページを検査
        if: ${{ always() }}
        run: |
          node scripts/test-reconstruction-health-care.mjs
          node scripts/test-reconstruction-family.mjs
          node scripts/test-reconstruction-work-business.mjs
          node scripts/test-reconstruction-agriculture-fishery.mjs
          node scripts/test-reconstruction-integrated-qa.mjs
          node scripts/test-reconstruction-production-entry.mjs
          node scripts/build-site-phase.mjs --check
          node scripts/test-reconstruction-operations.mjs
          node scripts/test-reconstruction-case-management.mjs
          node scripts/test-reconstruction-gap-navigation.mjs
          node scripts/test-reconstruction-action-nav.mjs
          node scripts/test-reconstruction-consultation-memo.mjs
          node scripts/test-reconstruction-official-search.mjs
          node scripts/test-reconstruction-ux-simplification.mjs
          node scripts/test-reconstruction-final-scenarios.mjs
          node scripts/test-reconstruction-core-product.mjs
          node scripts/test-reconstruction-information-quality.mjs
          node scripts/test-reconstruction-source-change.mjs
          node scripts/test-reconstruction-contact-document.mjs
          node scripts/test-reconstruction-eligibility.mjs
          node scripts/test-reconstruction-amount-benefit.mjs
          node scripts/test-reconstruction-public-data.js
          node scripts/test-reconstruction-documents.mjs
          node scripts/test-reconstruction-content-ux.mjs
          node scripts/test-reconstruction-municipality-handoff.mjs
          node scripts/test-priority-municipality-coverage.mjs
          node scripts/test-professional-support.mjs
          node scripts/test-official-timeline.mjs
          node scripts/test-water-recovery.mjs
          node scripts/test-response-tracks.mjs
          node scripts/test-volunteer-centers.mjs
          node scripts/test-reconstruction-release-readiness.mjs

      - name: JavaScript構文を検査
        if: ${{ always() }}
        run: |
          node --check reconstruction-health-care.js
          node --check reconstruction-family.js
          node --check reconstruction-work-business.js
          node --check reconstruction-agriculture-fishery.js
          node --check reconstruction-category-relations.js
          node --check reconstruction-action-nav.js
          node --check reconstruction-consultation-memo.js
          node --check reconstruction-search.js
          node --check scripts/build-reconstruction-search-index.mjs
          node --check scripts/build-reconstruction-operations-status.mjs
          node --check scripts/monitor-reconstruction-sources.mjs
          node --check scripts/reconstruction-source-change.mjs
          node --check scripts/reconstruction-contact-document-policy.mjs
          node --check scripts/reconstruction-eligibility-policy.mjs
          node --check scripts/build-reconstruction-contact-document-status.mjs
          node --check scripts/build-reconstruction-eligibility-status.mjs
          node --check scripts/reconstruction-amount-benefit-policy.mjs
          node --check scripts/build-reconstruction-amount-benefit-status.mjs
          node --check app.js
          node --check tools/fetch-hq.mjs
          node --check tools/fetch-municipality-updates.mjs
          node --check tools/fetch-official-topics.mjs
          node --check tools/build-shelters.mjs

      - name: Workflowの安全性を検査
        if: ${{ always() }}
        run: |
          node scripts/test-refresh-official-workflow.mjs

      - name: 差分の空白エラーを検査
        if: ${{ always() }}
        run: |
          git diff --check
