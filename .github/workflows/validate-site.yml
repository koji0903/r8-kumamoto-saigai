name: サイト整合性チェック

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML・データ・JavaScriptを検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5
        with:
          # sitemap.xml の lastmod は各HTMLの最終コミット日から生成する。
          # shallow cloneではHTML以外だけを更新したcommitで履歴を取得できない。
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: サイト全体を検査
        run: npm run check
