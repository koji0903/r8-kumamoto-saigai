name: サイト整合性チェック

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML・データ・JavaScriptを検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: データ整合性を検査
        run: |
          node tools/check-data.mjs
          node --check app.js
          node --check tools/fetch-hq.mjs
          node --check tools/fetch-municipality-updates.mjs
          node --check tools/fetch-official-topics.mjs
          git diff --check
