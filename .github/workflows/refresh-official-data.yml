name: 公式災害情報の定期更新

on:
  schedule:
    # 3時間ごと（UTC基準）。実行時刻はGitHub側の混雑で多少前後します。
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "収集・分類・検証だけを実行し、commit/pushしない"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-official-disaster-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5
        with:
          ref: main
          # build-seo.mjs が各HTMLの最終コミット日を取得できるよう全履歴を使う。
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 熊本県資料PDFのキャッシュを復元
        uses: actions/cache@v5
        with:
          path: sources/official/hq
          key: hq-pdfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hq-pdfs-${{ runner.os }}-

      - name: PDF抽出ライブラリを準備
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: 熊本県災害対策本部資料を更新
        run: |
          node tools/fetch-hq.mjs
          python tools/build-hq-damage.py

      - name: 市町村公式発信を更新
        run: node tools/fetch-municipality-updates.mjs

      - name: 災害ボランティアセンター（市町村社協）の発信を更新
        run: node tools/fetch-volunteer-centers.mjs

      - name: トップページの公的最新トピックスを更新
        run: node tools/fetch-official-topics.mjs

      - name: 開設中避難所を更新
        shell: bash
        run: |
          shelter_url="https://portal.bousai.pref.kumamoto.jp/data/shelter/shelter.json"
          shelter_json=""
          for attempt in 1 2 3; do
            candidate="/tmp/kumamoto-open-shelters-${attempt}.json"
            if curl --fail --silent --show-error --location \
              --connect-timeout 20 --max-time 90 \
              "${shelter_url}" --output "${candidate}" && \
              node -e 'const fs=require("fs");const file=process.argv[1];const raw=JSON.parse(fs.readFileSync(file,"utf8"));if(!Array.isArray(raw.items)||raw.items.length===0)throw Error("items配列が空です")' "${candidate}"; then
              shelter_json="${candidate}"
              break
            fi
            echo "避難所JSONの取得または検証に失敗しました (${attempt}/3)。"
            sleep $((attempt * 2))
          done
          if [[ -z "${shelter_json}" ]]; then
            echo "::warning::熊本県の避難所JSONを3回検証できなかったため、既存の検証済み避難所データを保持します。"
          else
            retrieved_at="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:00+09:00')"
            if ! node tools/build-shelters.mjs "${shelter_json}" "--retrieved-at=${retrieved_at}"; then
              echo "::warning::取得した避難所JSONから安全な生成物を作れなかったため、既存データを保持します。"
            fi
          fi

      - name: 厳密制度の公式根拠を変更監視
        run: node scripts/monitor-reconstruction-sources.mjs

      - name: 暮らしの再建公開データを生成
        run: node scripts/build-reconstruction-public-data.js

      - name: 公式根拠変更監視を検査
        run: node scripts/test-reconstruction-source-change.mjs

      - name: 必要書類・窓口を検査
        run: node scripts/test-reconstruction-contact-document.mjs

      - name: 対象条件を検査
        run: node scripts/test-reconstruction-eligibility.mjs

      - name: 金額・支援種別を検査
        run: node scripts/test-reconstruction-amount-benefit.mjs

      - name: データ整合性を検査
        run: |
          node tools/build-seo.mjs
          node tools/check-data.mjs
          node --check app.js
          node --check tools/fetch-hq.mjs
          node --check tools/fetch-municipality-updates.mjs
          node --check tools/fetch-official-topics.mjs
          node --check tools/fetch-volunteer-centers.mjs
          node --check tools/build-shelters.mjs
          git diff --check

      - name: 暮らしの再建・自治体公式情報ナビを生成
        run: node scripts/run-municipality-official-nav-pipeline.mjs

      - name: 自治体公式情報ナビを検証・集計
        run: |
          node scripts/validate-municipality-official-nav.mjs
          node scripts/build-official-timeline.mjs
          node scripts/build-water-recovery.mjs
          node scripts/build-response-tracks.mjs
          node scripts/test-volunteer-centers.mjs
          node scripts/test-reconstruction-coverage.mjs
          node -e 'const r=require("./reports/municipality-official-navigation-quality.json"); console.log(`入力: ${r.inputCount}件 / 分類: ${r.classifiedPageCount}件 / 表示候補: ${r.displayCandidateCount}件 / 未分類: ${r.unclassifiedCount}件 / 除外: ${r.excludedCount}件 / warning: ${r.warningCount}件`); for(const [key,value] of Object.entries(r.categoryReport)) console.log(`${key}: ${value.total}件 (high ${value.high} / medium ${value.medium} / low ${value.low})`); console.log(`21市町村fallback: ${Object.values(r.municipalityReport).filter(x=>x.fallback).length}/21`); if(r.errors.length) process.exit(1);'
          node --check scripts/run-municipality-official-nav-pipeline.mjs
          node --check scripts/validate-municipality-official-nav.mjs
          node scripts/test-refresh-official-workflow.mjs
          git diff --check

      - name: 暮らしの再建・運用ステータスを生成
        run: |
          node scripts/build-site-phase.mjs --check
          node scripts/test-reconstruction-operations.mjs
          node scripts/build-reconstruction-operations-status.mjs
          node scripts/build-reconstruction-information-quality-status.mjs
          node scripts/build-reconstruction-contact-document-status.mjs
          node scripts/build-reconstruction-eligibility-status.mjs
          node scripts/build-reconstruction-amount-benefit-status.mjs
          node scripts/test-reconstruction-information-quality.mjs

      - name: dry-run結果を記録
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "dry-runのためcommit/pushは行いません。"
          git status --short

      - name: 確認済みデータを反映
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            '*.html' \
            sitemap.xml \
            data/generated/hq-damage-data.js \
            data/generated/hq-index.js \
            data/generated/hq-latest.js \
            data/generated/municipality-updates.js \
            data/generated/official-topics.js \
            data/generated/volunteer-center-updates.js \
            data/generated/shelters-data.js \
            sources/official/hq-damage \
            sources/official/hq-index.json \
            sources/official/municipalities/municipality-updates.json \
            sources/official/topics/latest-topics.json \
            sources/official/volunteer-centers/volunteer-center-updates.json \
            data/reconstruction/source-change-events.json \
            data/reconstruction/source-revisions.json \
            data/reconstruction/sources.json \
            data/reconstruction/programs.json \
            data/reconstruction/applications.json \
            data/reconstruction/amount-benefits.json \
            data/reconstruction/application-periods.json \
            data/reconstruction/required-documents.json \
            data/reconstruction/contacts.json \
            data/reconstruction/next-actions.json \
            public-data/reconstruction/programs.json \
            public-data/reconstruction/municipalities.json \
            public-data/reconstruction/categories.json \
            public-data/reconstruction/home.json \
            public-data/reconstruction/money.json \
            public-data/reconstruction/municipality-official-navigation.json \
            public-data/reconstruction/official-search-index.json \
            public-data/reconstruction/official-timeline.json \
            public-data/reconstruction/water-recovery.json \
            public-data/reconstruction/response-tracks.json \
            reports/municipality-official-navigation-quality.json \
            reports/reconstruction-source-state.json \
            reports/reconstruction-source-review-queue.json \
            reports/reconstruction-operations-status.json \
            docs/reconstruction-source-review-queue.md \
            docs/reconstruction-operations-status.md \
            docs/reconstruction-information-quality-status.md \
            docs/reconstruction-contact-document-status.md \
            docs/reconstruction-eligibility-status.md \
            docs/reconstruction-amount-benefit-status.md
          if git diff --cached --quiet; then
            echo "反映対象の差分はありません。"
            exit 0
          fi
          checked_at="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          git commit -m "公式災害情報と暮らし公式ナビを自動更新 (${checked_at})"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "最新mainとの統合に失敗しました。生成済みデータは公開せず終了します。"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "pushが競合しました。最新mainを取得して再試行します (${attempt}/3)。"
          done
          echo "3回再試行してもpushできませんでした。force pushは行いません。"
          exit 1
