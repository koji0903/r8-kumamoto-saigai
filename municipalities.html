<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自治体別｜火の国 災害支援レポート</title><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">火</span><span>火の国<br><b>災害支援レポート</b></span></a><nav></nav><span class="updated" id="updated"></span></header><main id="main"><section class="subpage-hero"><p class="kicker">BY MUNICIPALITY</p><h1>自治体別に見る</h1><p>被害の大きい宇土市・宇城市・氷川町・八代市を重点地域として先に表示し、その他の対象自治体を続けて掲載します。会議記録で自治体名が明記された情報のみを整理しています。</p></section><section class="priority-region-banner"><div><span>重点地域</span><b>宇土市・宇城市・氷川町・八代市</b></div><p>表示上の優先区分です。被害程度の順位や、その他自治体に被害がないことを示すものではありません。</p></section><section class="section municipality-section"><div class="municipality-dashboard"><aside class="municipality-picker"><label><span>市町村を検索</span><input id="municipalityDashboardSearch" type="search" placeholder="市町村名"></label><div id="municipalityPickerList" role="listbox"></div></aside><div class="municipality-detail" id="municipalityDetail" aria-live="polite"></div></div></section></main><footer><div class="brand footer-brand"><span class="brand-mark">火</span><span>火の国<br><b>災害支援レポート</b></span></div><p>推測や合計値の按分は行っていません。</p><a href="index.html">サマリーへ</a></footer><script src="data.js"></script><script src="app.js"></script></body></html>
